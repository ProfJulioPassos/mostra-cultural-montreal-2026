<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Code — Indonésia • Montreal</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#edf2f6;color:#072e58;font-family:system-ui,Arial,sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}.sheet{width:min(100%,510px);background:#fffaf0;text-align:center;border:8px double #ffb933;border-radius:20px;padding:24px 16px;box-shadow:0 8px 30px #1c46722a}.brand{font-weight:900;letter-spacing:2px;color:#062c57;font-size:15px}.title{font-size:35px;font-weight:1000;margin:10px 0 0}.flag{font-size:38px}#qr{display:flex;justify-content:center;margin:19px auto}#qr img,#qr canvas{border:12px solid #fff;box-shadow:0 0 0 1px #bbb;border-radius:5px;max-width:100%;height:auto}a{color:#0760a2;overflow-wrap:anywhere;font-size:12px}.line{font-size:15px}button{padding:12px 24px;font-size:16px;color:#fff;background:#062c57;border:0;border-radius:10px;cursor:pointer}@media print{body{background:#fff;padding:0}.sheet{box-shadow:none;border-radius:0}button{display:none}}</style></head><body><main class="sheet"><div class="brand">MONTREAL BILÍNGUE</div><div class="flag">🇮🇩</div><h1 class="title">INDONÉSIA</h1><p class="line">Conheça o dragão-de-komodo em 3D!</p><p><strong>Escaneie o QR Code com seu celular</strong></p><div id="qr"></div><p id="url"></p><button onclick="window.print()">Imprimir cartaz</button></main><script>const dest=new URL('./',location.href).href;document.getElementById('url').innerHTML='<a href="'+dest+'">'+dest+'</a>';if(window.QRCode){new QRCode(document.getElementById('qr'),{text:dest,width:245,height:245,colorDark:'#062d59',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H});}else{document.getElementById('qr').textContent='Conecte-se à internet para gerar o QR Code.';}</script></body></html>
